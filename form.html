<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="author" content="Yumeto Kozume">
    <meta name="description"
        content="create a form to review a product. It is user-friendly on both mobile and desktop screens.">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">

            <!--product name-->
            <fieldset>
                <label>Product Name</label>
                <select name="product" id="product" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>
            </fieldset>

            <!--overall rating-->
            <fieldset>
                <legend>Overall Rating</legend>
                <div class="star">
                    <label><input type="radio" id="rating" name="rating" value="1" required>☆</label>
                    <label><input type="radio" id="rating" name="rating" value="2" required>☆☆</label>
                    <label><input type="radio" id="rating" name="rating" value="3" required>☆☆☆</label>
                    <label><input type="radio" id="rating" name="rating" value="4" required>☆☆☆☆</label>
                    <label><input type="radio" id="rating" name="rating" value="5" required>☆☆☆☆☆</label>
                </div>
            </fieldset>

            <!--date of installation-->
            <fieldset>
                <legend>Date of Installation</legend>
                <input type="date" id="date" name="date" required>
            </fieldset>

            <!--useful features-->
            <fieldset class="feature">
                <legend>Which features did you find usefull in the product? (Check all that apply)</legend>
                <label><input type="checkbox" name="features" value="durability">Durability</label>
                <label><input type="checkbox" name="features" value="ease of use">Ease of Use</label>
                <label><input type="checkbox" name="features" value="performance">performance</label>
                <label><input type="checkbox" name="features" value="design">Design</label>
            </fieldset>

            <!--written review-->
            <fieldset>
                <label>Written Review (Optional)</label>
                <textarea name="review" id="review"></textarea>
            </fieldset>

            <!--user name-->
            <fieldset>
                <label>Your Name (Optional)</label>
                <input type="text" id="name" name="name">
            </fieldset>

            <!--form submission button-->
            <fieldset>
                <input type="submit" value="Post Review">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>©<span id="currentyear"></span>⚽ Yumeto Kozuma ⚽ Japan</p>
        <p id="lastModified">lastModification: </p>
    </footer>
</body>

</html>
